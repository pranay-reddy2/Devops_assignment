{{- if not .Values.postgres.existingSecret }}
{{- $password := required "postgres.password is required (or set postgres.existingSecret)" .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spendwise.fullname" . }}-db
  labels: {{- include "spendwise.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.username $password (include "spendwise.fullname" .) .Values.postgres.database | quote }}
{{- end }}
