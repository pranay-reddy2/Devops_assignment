apiVersion: v1
kind: Pod
metadata:
  name: {{ include "spendwise.fullname" . }}-test-api
  labels: {{- include "spendwise.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: wget
      image: busybox:1.36
      command: ["sh", "-c", "wget -qO- http://{{ include "spendwise.fullname" . }}-backend:8000/ready && wget -qO- http://{{ include "spendwise.fullname" . }}-frontend/api/expenses/summary"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
