apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spendwise.fullname" . }}-frontend
  labels: {{- include "spendwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.hpa.frontend.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "spendwise.selector" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels: {{- include "spendwise.selector" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "spendwise.podSecurity" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "spendwise.image" (dict "repository" .Values.image.frontend.repository "tag" .Values.image.frontend.tag "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: BACKEND_URL      # nginx proxies /api here when the app is used without the Ingress
              value: http://{{ include "spendwise.fullname" . }}-backend:8000
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- include "spendwise.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}   # envsubst writes the rendered config here
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: nginx-conf, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spendwise.fullname" . }}-frontend
  labels: {{- include "spendwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector: {{- include "spendwise.selector" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - {name: http, port: 80, targetPort: http}
