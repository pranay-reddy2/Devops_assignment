apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spendwise.fullname" . }}-backend
  labels: {{- include "spendwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.backend.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "spendwise.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels: {{- include "spendwise.selector" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "spendwise.podSecurity" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Runs the Alembic migration before the API starts; retries until the DB accepts connections.
        - name: migrate
          image: {{ include "spendwise.image" (dict "repository" .Values.image.backend.repository "tag" .Values.image.backend.tag "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "for i in $(seq 1 30); do alembic upgrade head && exit 0; echo 'waiting for database...'; sleep 2; done; exit 1"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "spendwise.secretName" . }}, key: database-url}}
          {{- include "spendwise.containerSecurity" . | nindent 10 }}
      containers:
        - name: backend
          image: {{ include "spendwise.image" (dict "repository" .Values.image.backend.repository "tag" .Values.image.backend.tag "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: {{ include "spendwise.fullname" . }}-config}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "spendwise.secretName" . }}, key: database-url}}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- include "spendwise.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spendwise.fullname" . }}-backend
  labels: {{- include "spendwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector: {{- include "spendwise.selector" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - {name: http, port: 8000, targetPort: http}
