# PostgreSQL as a StatefulSet: stable identity + one PersistentVolumeClaim per replica.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spendwise.fullname" . }}-postgres
  labels: {{- include "spendwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector: {{- include "spendwise.selector" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "spendwise.fullname" . }}-postgres
  labels: {{- include "spendwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "spendwise.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "spendwise.selector" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels: {{- include "spendwise.selector" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - {name: postgres, containerPort: 5432}
          envFrom:
            - configMapRef: {name: {{ include "spendwise.fullname" . }}-config}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "spendwise.secretName" . }}, key: password}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
