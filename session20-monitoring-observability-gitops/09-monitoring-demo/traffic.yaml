# Steady traffic so the dashboards and request-rate queries have something to show.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic
  template:
    metadata:
      labels:
        app: traffic
    spec:
      containers:
        - name: wget
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O /dev/null http://podinfo.demo:9898/; wget -q -O /dev/null http://podinfo.demo:9898/status/500 2>/dev/null; sleep 0.2; done"]
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
