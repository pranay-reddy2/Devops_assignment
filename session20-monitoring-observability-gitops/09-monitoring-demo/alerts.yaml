# Custom alerting rules for the demo application.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: podinfo-alerts
  namespace: demo
spec:
  groups:
    - name: podinfo.rules
      rules:
        - alert: PodinfoDown
          expr: absent(up{job="podinfo", namespace="demo"} == 1)
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "podinfo has no healthy scrape targets"
            description: "No podinfo pod in namespace demo has been up for 30s."
        - alert: PodinfoHighCPU
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="demo", container="podinfo"}[2m])) by (pod) > 0.2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "podinfo pod {{ $labels.pod }} uses > 200m CPU"
        - alert: PodinfoHighMemory
          expr: max(container_memory_working_set_bytes{namespace="demo", container="podinfo"}) by (pod) > 100 * 1024 * 1024
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "podinfo pod {{ $labels.pod }} uses > 100Mi memory"
