# Stuck in ContainerCreating: the volume points at a ConfigMap that does not exist,
# so the kubelet cannot mount it and never starts the container.
apiVersion: v1
kind: Pod
metadata:
  name: creating-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
  volumes:
    - name: site
      configMap:
        name: site-content
