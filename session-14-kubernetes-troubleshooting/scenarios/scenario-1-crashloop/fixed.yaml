# Fix: provide DATABASE_URL (from a Secret, since it holds credentials).
# The instructor's script exits right after a successful start, which a Pod with
# restartPolicy Always would also restart (exit 0 = "Completed" loop), so the
# fixed app keeps running like a real server would.
apiVersion: v1
kind: Secret
metadata:
  name: app-db
  labels:
    tier: triage-gauntlet
stringData:
  DATABASE_URL: postgresql://app:app-password@postgres-db.production.svc.cluster.local:5432/app
---
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: PYTHONUNBUFFERED   # print() is block-buffered without a TTY; flush so kubectl logs shows it
          value: "1"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-db
              key: DATABASE_URL
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!")
          time.sleep(3600)
