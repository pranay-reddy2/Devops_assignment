# Configuration issue: the env var comes from a ConfigMap key that does not
# exist (LOG_LEVEL vs log_level), so the container cannot be created:
# STATUS = CreateContainerConfigError.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  log_level: debug
  APP_MODE: production
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo APP_MODE=$APP_MODE LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
      env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_MODE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
