# Fixed: reference the key that actually exists in the ConfigMap (log_level).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  log_level: debug
  APP_MODE: production
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo APP_MODE=$APP_MODE LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
      env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_MODE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: log_level
