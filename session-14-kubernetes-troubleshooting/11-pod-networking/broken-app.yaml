# Pod networking issue: the app listens on 127.0.0.1 only. It works from
# inside its own container but every other Pod (and the Service) gets
# "connection refused" on the Pod IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: net-app
  template:
    metadata:
      labels:
        app: net-app
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-m", "http.server", "8000", "--bind", "127.0.0.1"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: net-app
spec:
  selector:
    app: net-app
  ports:
    - port: 80
      targetPort: 8000
