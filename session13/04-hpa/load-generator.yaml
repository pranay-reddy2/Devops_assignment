# Same load generator as the kubectl run command in readme1.md, as a manifest.
# busybox loops wget against the ClusterIP Service so every replica gets traffic.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c", "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"]
