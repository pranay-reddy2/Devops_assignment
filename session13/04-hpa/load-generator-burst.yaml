# Step 5 "increase application load": 4 more busybox workers hammering the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator-burst
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-generator-burst
  template:
    metadata:
      labels:
        app: load-generator-burst
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"]
