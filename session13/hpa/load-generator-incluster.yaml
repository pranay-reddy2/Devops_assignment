# load_generator.sh drives traffic through `kubectl port-forward svc/...`, which
# pins every request to ONE pod and is throttled by the port-forward tunnel, so the
# average CPU never crossed 50%. Generating load inside the cluster goes through the
# Service's kube-proxy load balancing and reaches every replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-load-generator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: yatri-load-generator
  template:
    metadata:
      labels:
        app: yatri-load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://yatri-backend-service/healthz > /dev/null; done"]
