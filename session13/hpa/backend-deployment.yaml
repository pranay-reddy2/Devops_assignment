# The Deployment that hpa-backend.yaml (scaleTargetRef: yatri-backend) and
# backend-service.yaml (targetPort 5000) expect. It was missing from the folder.
# A tiny Python HTTP server on :5000; /healthz does a little hashing so that
# load_generator.sh produces measurable CPU for the HPA.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-backend-code
  labels:
    app: yatri-backend
data:
  server.py: |
    import hashlib, os, socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/healthz"):
                digest = b"yatri"
                for _ in range(2000):
                    digest = hashlib.sha256(digest).digest()
                body = f"ok from {socket.gethostname()}\n".encode()
                self.send_response(200)
            else:
                body = b"not found\n"
                self.send_response(404)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    ThreadingHTTPServer(("0.0.0.0", 5000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: yatri-backend-code
